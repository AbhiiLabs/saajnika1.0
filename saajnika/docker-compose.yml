version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: saajnika_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saajnika_db}
      POSTGRES_USER: ${POSTGRES_USER:-saajnika_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saajnika_secure_password_2025}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saajnika_user} -d ${POSTGRES_DB:-saajnika_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saajnika_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saajnika_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-saajnika-prod-grade-secret-key-32chars-min}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      DATABASE_URL: postgres://${POSTGRES_USER:-saajnika_user}:${POSTGRES_PASSWORD:-saajnika_secure_password_2025}@postgres:5432/${POSTGRES_DB:-saajnika_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_saajnika_sandbox}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-test_secret_saajnika}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    expose:
      - "8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saajnika_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-saajnika-prod-grade-secret-key-32chars-min}
      DATABASE_URL: postgres://${POSTGRES_USER:-saajnika_user}:${POSTGRES_PASSWORD:-saajnika_secure_password_2025}@postgres:5432/${POSTGRES_DB:-saajnika_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saajnika_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-saajnika-prod-grade-secret-key-32chars-min}
      DATABASE_URL: postgres://${POSTGRES_USER:-saajnika_user}:${POSTGRES_PASSWORD:-saajnika_secure_password_2025}@postgres:5432/${POSTGRES_DB:-saajnika_db}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saajnika_frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    container_name: saajnika_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_volume:/var/www/media:ro
      - static_volume:/var/www/static:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  media_volume:
  static_volume:
